name: Uji Kode

# Catatan: uji akurasi BPM yang memerlukan kunci jawaban TIDAK dijalankan di
# sini, karena kunci jawaban sengaja tidak disimpan di repo peserta sampai sesi
# simulasi selesai. Uji itu hidup di repo internal pemateri
# (BMW2026-Basic-Python-Pemateri, workflow "Uji Kunci Jawaban").

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Siapkan Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Pasang dependensi
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Semua berkas Python bisa dikompilasi
        run: python -m compileall -q data demo exercises src tests tools

      # Sengaja tidak memblokir. Kerangka latihan memang belum rapi, dan PR
      # peserta tidak boleh merah cuma karena spasi. Hasilnya tetap terbaca
      # di log dan di ringkasan run.
      - name: Gaya penulisan kode (laporan saja, tidak memblokir)
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: Bangkitkan dataset sintetis
        run: python data/make_dataset.py

      - name: Dataset harus deterministik
        run: git diff --exit-code -- data/ecg_sample.csv data/ppg_sample.csv data/reference_bpm.csv data/kpp

      - name: Uji cepat repositori peserta
        run: python tools/uji_cepat.py

      # test_cp2_progres.py memakai xfail, jadi langkah ini tetap hijau selagi
      # TODO CP2 belum dikerjakan. Yang wajib hijau adalah test_fungsi_dasar.py.
      - name: pytest
        run: pytest -q

      - name: Live demo tetap jalan tanpa data MIT-BIH
        env:
          MPLBACKEND: Agg
        run: python demo/live_demo_mitbih.py --tanpa-gambar

      - name: Kunci jawaban tidak boleh bocor sebelum sesi
        run: |
          if [ -d solutions ]; then
            echo "Folder solutions/ ada di repo peserta."
            echo "Ini hanya boleh terjadi setelah sesi simulasi 22 Agustus 2026 selesai."
            echo "Kalau sesi belum lewat, batalkan commit tersebut."
          else
            echo "Aman: kunci jawaban masih di repo pemateri."
          fi
